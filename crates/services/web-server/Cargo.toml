[package]
name = "web-server"
version = "0.1.0"
edition = "2024"

# web-server is a native-only axum/tokio binary — never built for
# wasm32. Everything here (tokio's "signal"/"net" reactor, axum, sqlx via
# lib-db, …) drags mio along, which doesn't support
# wasm32-unknown-unknown. It's all under a non-wasm32 target gate purely
# so hakari's workspace-wide, per-platform feature unification (see
# .config/hakari.toml's `platforms`) doesn't force it into the
# web-frontend wasm32 build via workspace-hackari — this has no effect on
# the actual (native) build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "fs"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = "2"
workspace-hackari = { version = "0.1", path = "../../workspace-hackari" }

# Loads `.env` (from the working directory the binary is run from) into
# the process's environment before anything reads a `CLOUDFLARE_*`/
# `DATABASE_URL`/etc. var — see `main.rs`. A missing file is fine (real
# deploys just set these directly); this only fills in what's absent, so
# already-exported vars still win.
dotenvy = "0.15"

lib-db = { version = "0.1", path = "../../libs/lib-db" }
uuid = { version = "1", features = ["serde"] }

# OTLP export for `tracing` — see main.rs's `OTEL_EXPORTER_OTLP_ENDPOINT`
# gating and lib-tracing's own doc comment for the full story.
lib-tracing = { version = "0.1", path = "../../libs/lib-tracing" }

# The transcode + asset-publish DI seam `AppState` holds as `Arc<dyn Trait>`
# (see state.rs) — this crate is the composition root that picks concrete
# implementations (main.rs) and drives them (worker.rs).
lib-gstreamer = { version = "0.1", path = "../../libs/lib-gstreamer" }
lib-cloudflare = { version = "0.1", path = "../../libs/lib-cloudflare" }
lib-storage = { version = "0.1", path = "../../libs/lib-storage" }
# The download-source DI seam `AppState` holds a registry of as
# `Arc<dyn DownloadProvider>` per provider — same composition-root story
# as lib-gstreamer/lib-storage above, see state.rs and remote_sync.rs.
lib-download = { version = "0.1", path = "../../libs/lib-download" }

# gRPC clients for the DI seam above: main.rs's `build_transcoder`/
# `build_asset_store`/`build_download_providers` each pick one of these
# over the in-process impl when the matching `SVC_*_ADDR` env var is set
# — see crates/services/GRPC_MIGRATION.md. Depending on the whole
# service crate (not just splitting out a `-client` crate) is a
# deliberate simplification: the extra server-side code these crates
# also carry (service.rs, main.rs) is unused dead weight in web-server's
# own binary, but small, and avoids a fourth crate-per-service just to
# hold what client.rs already is.
svc-transcode = { version = "0.1", path = "../svc-transcode" }
svc-assets = { version = "0.1", path = "../svc-assets" }
svc-download = { version = "0.1", path = "../svc-download" }
# GrpcDownloadProvider (main.rs) implements lib_download::DownloadProvider,
# which is #[async_trait] — was dev-only below (remote_sync's tests faking
# the same trait) before this DI seam needed a real impl of it too.
async-trait = { workspace = true }
# status_to_download_error (main.rs) matches on tonic::Status/Code
# directly — svc-download's client already returns tonic::Status errors,
# so this crate needs the type even though it isn't a tonic server itself.
tonic = { workspace = true }

# Live job progress over SSE (routes/jobs.rs, job_events.rs): `sync` gets us
# `BroadcastStream`, adapting the per-job `tokio::sync::broadcast` hub into
# the `Stream` axum's `Sse` wants; `async-stream` builds that handler's
# stream with plain `yield`s instead of a hand-rolled `Stream` impl.
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"

# OpenAPI: utoipa generates the spec from `#[utoipa::path]`-annotated
# handlers + `ToSchema` DTOs (lib-db's models carry those already);
# utoipa-axum wires that generation straight into the axum router
# instead of a hand-maintained spec file; utoipa-swagger-ui serves it.
utoipa = { version = "5", features = ["uuid", "time"] }
utoipa-axum = "0.2"
# "vendored": without it, utoipa-swagger-ui's build script downloads the
# Swagger UI zip from GitHub at *build* time — fine with plain `cargo
# build` online, but a hard failure under `nix build`'s sandbox (no
# network, no `curl` on PATH either). Vendoring embeds the assets in the
# crate instead, so both build the same way.
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tower = { version = "0.5", features = ["util"] }
lib-db = { version = "0.1", path = "../../libs/lib-db", features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
