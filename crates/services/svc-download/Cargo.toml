[package]
name = "svc-download"
edition = "2024"
version.workspace = true

# Native-only tonic server wrapping lib-download — never built for
# wasm32, hence the target gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lib-download = { version = "0.1", path = "../../libs/lib-download" }
# Generated proto types + `DownloadGrpcClient`, re-exported from
# `src/lib.rs` — see that file's doc comment.
lib-download-client = { version = "0.1", path = "../../libs/lib-download-client" }
lib-tracing = { version = "0.1", path = "../../libs/lib-tracing" }
tower-http = { workspace = true, features = ["trace"] }
tonic = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# service.rs's own `DownloadServiceImpl` impl is `#[tonic::async_trait]`
# (no dep needed for that), but its `#[cfg(test)]` fakes implement
# `lib_download::DownloadProvider`, which is `#[async_trait]`.
async-trait = { workspace = true }
dotenvy = "0.15"

# tests/grpc_roundtrip.rs: TcpListenerStream lets that test bind an
# OS-assigned port itself and hand the resulting stream to
# `Server::serve_with_incoming`, rather than needing the port fixed up
# front the way `Server::serve(addr)` would.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
