[package]
name = "svc-assets"
edition = "2024"
version.workspace = true

# Native-only tonic server wrapping lib-storage/lib-cloudflare — never
# built for wasm32. See lib-proto/Cargo.toml's comment.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lib-proto = { version = "0.1", path = "../../libs/lib-proto" }
lib-storage = { version = "0.1", path = "../../libs/lib-storage" }
lib-cloudflare = { version = "0.1", path = "../../libs/lib-cloudflare" }
lib-db = { version = "0.1", path = "../../libs/lib-db" }
tonic = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# AssetsGrpcClient (client.rs) implements lib_storage::AssetStore, which
# is #[async_trait].
async-trait = { workspace = true }
dotenvy = "0.15"
workspace-hackari = { version = "0.1", path = "../../workspace-hackari" }

[lints]
workspace = true
