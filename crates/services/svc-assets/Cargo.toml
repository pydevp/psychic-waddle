[package]
name = "svc-assets"
edition = "2024"
version.workspace = true

# Native-only tonic server wrapping lib-storage/lib-cloudflare — never
# built for wasm32, hence the target gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lib-storage = { version = "0.1", path = "../../libs/lib-storage" }
lib-cloudflare = { version = "0.1", path = "../../libs/lib-cloudflare" }
lib-db = { version = "0.1", path = "../../libs/lib-db" }
# Generated proto types + `AssetsGrpcClient`, re-exported from
# `src/lib.rs` — see that file's doc comment.
lib-assets-client = { version = "0.1", path = "../../libs/lib-assets-client" }
lib-tracing = { version = "0.1", path = "../../libs/lib-tracing" }
tower-http = { workspace = true, features = ["trace"] }
tonic = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = "0.15"

[lints]
workspace = true
