[package]
name = "lib-tracing"
version = "0.1.0"
edition = "2024"

# The OTLP/gRPC exporter stack here (tonic -> h2/hyper -> tokio "net")
# is native-only, never built for wasm32, hence the target gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
http = "1"
# Only for `propagation::tonic_support` (client interceptor + metadata
# injector); the svc-* crates and lib-*-client crates enable it.
tonic = { workspace = true, optional = true }
opentelemetry = "0.31.0"
opentelemetry-semantic-conventions = { version = "0.31.0", features = ["semconv_experimental"] }
opentelemetry_sdk = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic"] }
opentelemetry-stdout = { version = "0.31.0", features = ["metrics"] }
tracing-opentelemetry = "0.32.1"
opentelemetry-appender-tracing = "0.31.1"

[features]
tonic = ["dep:tonic"]

[lints]
workspace = true
