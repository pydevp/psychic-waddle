[package]
name = "lib-transcode-client"
edition = "2024"
version.workspace = true

# Thin gRPC client + generated proto types only — depends on
# `lib-transcode` (trait/types), never on a backend, so no native media
# libs (see src/lib.rs's doc comment). Never built for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true }
lib-tracing = { version = "0.1", path = "../lib-tracing", features = ["tonic"] }
tonic-prost = { workspace = true }
prost = { workspace = true }
lib-transcode = { version = "0.1", path = "../lib-transcode" }
async-trait = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
tonic-prost-build = { workspace = true }

[lints]
workspace = true
