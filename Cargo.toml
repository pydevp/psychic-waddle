[workspace.lints.rust]
# unsafe_code = "forbid"
# unused = { level = "allow", priority = -1 } # For exploratory dev.

[workspace]
resolver = "2"
members = [
    "crates/workspace-hackari",
    # -- Application Libraries
    "crates/libs/lib-cloudflare",
    "crates/libs/lib-db",
    "crates/libs/lib-download",
    "crates/libs/lib-gstreamer",
    "crates/libs/lib-proto",
    "crates/libs/lib-storage",
    "crates/libs/lib-tracing",
    # -- Application Services
    "crates/services/web-server",
    "crates/services/web-frontend",
    # -- gRPC microservices (see crates/services/GRPC_MIGRATION.md): each
    # wraps one of the DI-seam libs above (lib-gstreamer/lib-cloudflare+
    # lib-storage/lib-download) behind a tonic server, and exports a
    # client that implements that lib's existing trait over the wire —
    # web-server's composition root (main.rs) picks in-process or gRPC
    # per trait without anything downstream (worker.rs, routes) knowing
    # which.
    "crates/services/svc-transcode",
    "crates/services/svc-assets",
    "crates/services/svc-download",
]

# NOTE: Only the crates that are utilized in two or more sub-crates and benefit from global management
#       are handled in workspace.dependencies. Other strategies may also be valid.
[workspace.dependencies]
serde_with = { version = "3", features = ["time_0_3"] }
serde = { version = "1.0.228", features = ["derive"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
futures = "0.3.32"
tokio = { version = "1.52.4",features = ["macros"] }
# Shared by the trait/impl split behind the transcode + asset-publish DI
# seam: lib-storage (trait + LocalFsStore), lib-gstreamer (Transcoder impl),
# lib-cloudflare (WorkerAssetsStore impl) all need the same object-safety
# story for `Arc<dyn Trait>`.
async-trait = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# gRPC (see crates/libs/lib-proto and crates/services/svc-*): tonic 0.14
# split codegen (tonic-prost-build) and the runtime prost codec
# (tonic-prost) out of the core `tonic` crate — all three, plus `prost`
# for the generated message types, are pinned together here so every
# proto-touching crate stays on the same wire-compatible set. Building
# lib-proto needs a `protoc` on PATH (or `$PROTOC` set) — see flake.nix's
# devShell/svc-* nativeBuildInputs, which add `pkgs.protobuf` for this.
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"

[workspace.package]
version = "0.1.0"

[workspace.metadata.crane]
name = "next_file_browser"

# Applies to both the native web-server build and the wasm32 web-frontend
# build (flake.nix's `commonArgs`/`frontendArgs` don't set per-crate
# profiles, so both share this). `codegen-units = 1` + `lto = "thin"`
# trade build time for a smaller/faster binary; bump to `lto = "fat"` if
# the extra squeeze is worth slower `nix build`s. `panic = "unwind"`
# (the default) is left alone deliberately: web-server is a long-running
# axum/tokio process where a task panic should fail just that request,
# not `panic = "abort"` the whole server.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
